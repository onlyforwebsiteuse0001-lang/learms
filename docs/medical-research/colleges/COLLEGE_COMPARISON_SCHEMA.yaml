prohibited_inferences:
  - "directory_entry => current admission permission"
  - "seat_count => educational quality"
  - "hospital_count => clinical exposure quality"
  - "historical_cutoff => future guarantee"
  - "university_rank => MBBS_or_BDS_program_rank"
  - "fee => quality"
  - "missing_status_notice => no_legal_or_regulatory_issue"
