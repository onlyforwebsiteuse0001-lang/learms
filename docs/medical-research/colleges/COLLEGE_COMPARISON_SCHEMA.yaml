schema_version: "1.0"
title: "Evidence model for Pakistan medical and dental college comparison"
evidence_cutoff: "2026-09-30"
principles:
  - "A college, program, directory entry, seat observation, intake permission, hospital relationship, fee cap, and rank are separate entities or observations."
  - "Mutable facts require a source, access or issue date, and review status."
  - "Missing evidence is null plus not_found; it is never zero or false by assumption."
  - "No composite rank is generated without a published methodology and complete comparable inputs."
college_entity:
  stable_internal_id: null
  official_name: null
  aliases: []
  city: null
  province_or_region: null
program_observation:
  program: null
  sector: null
  directory_source_id: null
  directory_url: null
  accessed_date: null
  directory_entry_present: null
  seat_allocation: null
  complete_capture: false
  recognition_interpretation: "directory appearance only; not current intake permission"
status_events:
  - event_type: null
    status_text_verbatim: null
    issued_date: null
    source_id: null
    source_url: null
    valid_from: null
    valid_to: null
    review_status: "not_found"
teaching_hospitals:
  - hospital_name: null
    relationship_as_published: null
    source_document_date: null
    source_id: null
    inspection_context: null
    review_status: "not_found"
affiliation:
