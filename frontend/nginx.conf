server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep the browser same-origin: /api is proxied to FastAPI rather than exposed directly.
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Large study documents: do not buffer the whole body before forwarding.
    client_max_body_size 60m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    # Allow the planned /api/v1/ws/... upgrade without another server block.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The service worker must never be cached, or clients pin an old shell forever.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
